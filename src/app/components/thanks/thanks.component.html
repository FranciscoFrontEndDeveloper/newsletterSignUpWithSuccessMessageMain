<div
  class="screen-center"
>
  <div
    class="bg-white p-5 w-full min-h-screen grid grid-cols-1 grid-rows-[1fr_auto] gap-8 lg:h-2/3 lg:min-h-0 lg:w-1/2 lg:p-20 lg:gap-16 lg:overflow-y-auto rounded-[50px]"
  >
    <div class="flex flex-col justify-center gap-6 lg:gap-8">
      <div class="flex items-center">
        <picture
          ><img class="w-20" src="assets/images/icon-success.svg" alt=""
        /></picture>
      </div>
      <div class="flex items-center">
        <h1 class="text-4xl font-bold lg:text-7xl">Thanks for subscribing!</h1>
      </div>
      <div class="flex items-start">
        <p class="text-lg lg:text-2xl w-full">
          A confirmation email has been sent to
          <strong>{{ email }}</strong> Please open it and click the
          button inside to confirm your subscription.
        </p>
      </div>
    </div>
    <div class="flex items-end">
      <button (click)="dismiss()" type="button" class="bg-gray-800 text-white p-4 w-full rounded-lg font-bold hover:bg-[#ff6257] active:bg-[#ff6257] cursor-pointer">
        Dismiss message
      </button>
    </div>
  </div>
</div>
